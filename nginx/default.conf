server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /api/years/ {
        alias /data/car_show_pictures/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }
    location ~ "^/api/photos/([0-9]{4})/$" {
        alias /data/car_show_pictures/$1/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }
    location ~ "^/photos/([0-9]{4})/([^/]+\.(?i:jpe?g|png|webp|gif|avif))$" {
        alias /data/car_show_pictures/$1/$2;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache";
    }
    location /api/ { return 404; }
    location /photos/ { return 404; }
    location ~ "/\." { deny all; }
    location ~ "^/car-shows/[0-9]{4}/?$" { try_files /index.html =404; }
    location ~ "^/car-show-pictures-([0-9]{4})\.html$" { return 301 /car-shows/$1/; }
    location = /about-us.html { return 301 /#about; }
    location / { try_files $uri $uri/ =404; }
}
